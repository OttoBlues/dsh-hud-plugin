name: DSH component channel update worker

# Only user-requested packages already listed in released/ or unstable/ may
# install. Main source, unapproved packages and PR code are NEVER install inputs.
on:
  workflow_run:
    workflows: ['DSH plugins CI']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dsh-hud-self-hosted
  cancel-in-progress: false

jobs:
  gate:
    name: Verify current main has passed push CI
    if: github.repository == 'OttoBlues/dsh-plugins'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.check.outputs.approved }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        name: Validate repository, branch and green CI
        uses: actions/github-script@v8
        with:
          script: |
            const owner = 'OttoBlues';
            const repo = 'dsh-plugins';
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = branch.data.commit.sha;

            if (context.eventName === 'workflow_run') {
              const source = context.payload.workflow_run;
              if (!source ||
                  source.event !== 'push' ||
                  source.head_branch !== 'main' ||
                  source.head_sha !== sha ||
                  source.conclusion !== 'success' ||
                  source.head_repository?.full_name !== 'OttoBlues/dsh-plugins') {
                core.info('A non-current or non-successful CI event cannot deploy.');
                return;
              }
            }

            const checks = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              head_sha: sha,
              per_page: 30
            });
            const verified = checks.data.workflow_runs.some(run =>
              run.head_sha === sha &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );
            if (!verified) {
              core.info('Current main does not yet have a successful push CI run.');
              return;
            }
            core.setOutput('sha', sha);
            core.setOutput('approved', 'true');


  windows-channel-worker:
    name: Stage vetted packages and process confirmed update requests
    needs: gate
    if: needs.gate.outputs.approved == 'true'
    runs-on: [self-hosted, windows, x64, dsh-hud-test]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the exact released and unstable installers
        run: node scripts/verify-channels.mjs
      - name: Stage only approved channel archives and anonymous UI metadata
        run: .\scripts\windows\stage-channels.ps1
      - id: probe
        name: Verify explicit update click and experimental opt-in
        run: .\scripts\windows\auto-upgrade-probe.ps1
      - name: Install only requested vetted installer after DSH exits
        if: steps.probe.outputs.needed == 'true'
        env:
          TARGET_CHANNEL: ${{ steps.probe.outputs.channel }}
          TARGET_VERSION: ${{ steps.probe.outputs.version }}
        run: .\scripts\windows\desktop-deploy.ps1 -Mode upgrade -Channel $env:TARGET_CHANNEL -TargetVersion $env:TARGET_VERSION
      - name: Upload non-sensitive status reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-channel-worker-${{ github.run_id }}
          path: |
            auto-results/*.json
            deploy-results/*.json
          if-no-files-found: warn
          retention-days: 7
