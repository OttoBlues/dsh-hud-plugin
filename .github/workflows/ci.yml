name: DSH HUD CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-hud-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Verify source, components, channels and tests (GitHub-hosted Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, archive manifests, registry and unit tests
        run: npm run check

  windows-build:
    name: Test and structurally pack HUD (GitHub-hosted Windows)
    needs: linux-check
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, archive manifests, registry and unit tests
        run: npm run check
      - name: Pack candidate source for structural checks only
        run: npm run pack:hud
      - name: Verify candidate package structure
        run: npm run verify:pack
