name: DSH HUD CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-hud-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Verify source, components, channels and tests (GitHub-hosted Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, archive manifests, registry and unit tests
        run: npm run check

  windows-build:
    name: Test and structurally pack HUD (GitHub-hosted Windows)
    needs: linux-check
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source, archive manifests, registry and unit tests
        run: npm run check
      - name: Pack candidate source for structural checks only
        run: npm run pack:hud
      - name: Verify candidate package structure
        run: npm run verify:pack
      - name: Smoke-test native Windows WPF HUD window (without showing it)
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File ./plugins/hud/native/windows-hud.ps1 -SelfTest
      - name: Verify actual WPF window renders and closes without DSH side effects
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -STA -File ./plugins/hud/native/windows-hud.ps1 -SelfTestWindow

  publish-hud-v058:
    name: Publish immutable HUD v0.5.8 Unstable package (no Desktop deployment)
    needs: [linux-check, windows-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package explicitly requested v0.5.8 exactly once
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node scripts/publish-unstable-v058.mjs
      - name: Verify all original and new release archives
        run: npm run verify:channels
      - name: Record validated Unstable package without changing Released
        shell: bash
        run: |
          if ! git ls-files --error-unmatch plugins/hud/unstable/v0.5.8/manifest.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/hud/unstable/index.json plugins/hud/unstable/v0.5.8/
            git commit -m "release(unstable): publish immutable HUD v0.5.8 native RPC startup fix"
            git push origin HEAD:main
          fi
