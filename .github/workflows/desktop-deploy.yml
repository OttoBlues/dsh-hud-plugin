name: DSH HUD Desktop deployment

# Manual-only: no commits, PRs or schedules install/upgrade user Desktop.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect, install, upgrade or remove the HUD Bundle in the normal Desktop Profile'
        required: true
        type: choice
        default: check
        options: [check, install, upgrade, uninstall]

permissions:
  contents: read

concurrency:
  group: dsh-hud-self-hosted
  cancel-in-progress: false

jobs:
  desktop-deployment:
    if: github.repository == 'OttoBlues/dsh-plugins' && github.ref == 'refs/heads/main'
    name: Desktop HUD deployment
    runs-on: [self-hosted, windows, x64, dsh-hud-test]
    timeout-minutes: 15
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout trusted main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Set up Node for vetted release verification
        if: inputs.mode == 'install' || inputs.mode == 'upgrade'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved released/unstable install packages
        if: inputs.mode == 'install' || inputs.mode == 'upgrade'
        run: node scripts/verify-channels.mjs
      - name: Apply to the existing DSH Desktop profile
        run: .\scripts\windows\desktop-deploy.ps1 -Mode $env:DEPLOY_MODE
      - name: Upload non-sensitive deployment status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-desktop-deploy-${{ github.run_id }}
          path: deploy-results/*.json
          if-no-files-found: warn
          retention-days: 7
