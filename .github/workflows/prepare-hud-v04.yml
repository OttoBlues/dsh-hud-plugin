name: Prepare HUD v0.4 approved-unstable test candidate

# Single-purpose requested trial; no writes to Desktop and no stable promotion.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-hud-v04.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository == 'OttoBlues/dsh-plugins' &&
      startsWith(github.event.head_commit.message, 'build: prepare HUD v0.4.0 unstable verification package')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and build the V0.4.0 test-only archive
        run: |
          npm run check
          npm run pack:hud
          npm run verify:pack
      - name: Emit hash-verified archive for single unstable channel publication
        shell: bash
        run: |
          set -euo pipefail
          tarball="dist/local-dsh-hud-0.4.0.tgz"
          test -s "$tarball"
          echo "HUD_V04_VERSION:0.4.0"
          echo "HUD_V04_SOURCE_SHA:${{ github.sha }}"
          echo "HUD_V04_CI_RUN:${{ github.run_id }}"
          echo "HUD_V04_SHA256:$(sha256sum "$tarball" | cut -d' ' -f1)"
          echo "HUD_V04_ARCHIVE_BEGIN"
          base64 -w 96 "$tarball"
          echo
          echo "HUD_V04_ARCHIVE_END"
